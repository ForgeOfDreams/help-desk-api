name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # Required for Super-Linter to publish commit status checks.
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint repository
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          LINTER_RULES_PATH: .github/linters
          YAML_CONFIG_FILE: .yaml-lint.yml
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          # Super-Linter handles repository/config formats. PHP dependency-aware
          # checks run in the project's FrankenPHP container below, where the
          # required PHP extensions match composer.lock.
          # Super-Linter switches to opt-in mode when any VALIDATE_* is true.
          # Keep this list true-only; mixing true and false makes v9 fail during startup.
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          # Avoid requiring pull-requests: write just to post a PR comment.
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          SAVE_SUPER_LINTER_SUMMARY: true

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: pedantic

  production-image:
    name: Production image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production target without publishing
        run: >-
          docker build --pull --file .docker/Dockerfile
          --target frankenphp_prod --tag help-desk-api:ci .

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Use an extra Compose overlay for deterministic CI-only values.
      # GitHub-hosted runners are Linux, so Compose uses ':' as the file separator.
      COMPOSE_FILE: compose.yaml:compose.override.yaml:.github/compose.ci.yaml
      MYSQL_VERSION: '8.4'
      MYSQL_DATABASE: help_desk
      MYSQL_USER: helpdesk_ci
      MYSQL_PASSWORD: helpdesk_ci_password
      MYSQL_ROOT_PASSWORD: helpdesk_ci_root_password
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
      APP_FRONTEND_URL: http://localhost:5173
      APP_DEFAULT_SENDER: no-reply@example.test
      MAILER_DSN: smtp://mailer:1025

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build development image
        run: docker compose build --pull php

      # The application entrypoint waits for the database. Start its dependencies
      # first before running any one-off PHP command.
      - name: Start database and mailer
        run: docker compose up --detach --wait --wait-timeout 180 database mailer

      # Keep the normal image entrypoint: it prepares the development container and
      # installs Composer dependencies. Its DB readiness check now succeeds because
      # the database service was started in the previous step.
      - name: Generate ephemeral JWT key pair
        run: >-
          docker compose run --rm --no-deps php php bin/console
          lexik:jwt:generate-keypair --skip-if-exists --no-interaction

      - name: Start application and dependencies
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Validate Composer metadata
        run: docker compose exec -T php composer validate --strict

      - name: Verify PHP and extension requirements from composer.lock
        run: docker compose exec -T php composer check-platform-reqs --lock

      - name: Lint PHP syntax in the application runtime
        shell: bash
        run: |
          docker compose exec -T php sh -lc '
            set -eu
            for directory in src config migrations tests; do
              if [ -d "$directory" ]; then
                find "$directory" -type f -name "*.php" -print0
              fi
            done | xargs -0 -r -n 1 php -l
          '

      - name: Audit Composer dependencies
        run: docker compose exec -T php composer audit --locked --no-interaction

      - name: Lint Symfony configuration
        run: |
          docker compose exec -T php php bin/console lint:yaml config
          docker compose exec -T php php bin/console lint:container

      - name: Create test database if needed
        run: >-
          docker compose exec -T php php bin/console
          --env=test doctrine:database:create
          --if-not-exists --no-interaction

      - name: Synchronize migration metadata
        run: >-
          docker compose exec -T php php bin/console
          --env=test doctrine:migrations:sync-metadata-storage
          --no-interaction

      - name: Apply database migrations
        run: >-
          docker compose exec -T php php bin/console
          --env=test doctrine:migrations:migrate
          --no-interaction

      - name: Validate Doctrine schema
        run: >-
          docker compose exec -T php php bin/console
          --env=test doctrine:schema:validate

      - name: Run PHPUnit
        run: docker compose exec -T php php bin/phpunit

      - name: Check API documentation endpoint
        run: curl --insecure --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 https://localhost/api/docs --output /dev/null

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250

      - name: Stop services and remove CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
