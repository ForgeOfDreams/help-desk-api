# This overlay is used only by GitHub Actions. It must not be part of the local
# default Compose invocation or production configuration.
services:
  php:
    environment:
      APP_ENV: dev
      APP_SECRET: ci-only-not-a-production-secret
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_DEFAULT_SENDER: ${APP_DEFAULT_SENDER:-no-reply@example.test}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}

      # Doctrine appends "_test" automatically when running with APP_ENV=test.
      # Base name help_desk becomes help_desk_test.
      DATABASE_URL: 'mysql://${MYSQL_USER:-helpdesk_ci}:${MYSQL_PASSWORD:-helpdesk_ci_password}@database:3306/help_desk?serverVersion=${MYSQL_VERSION:-8.4}&charset=${MYSQL_CHARSET:-utf8mb4}'

      JWT_SECRET_KEY: /app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /app/config/jwt/public.pem
      JWT_PASSPHRASE: ''
    depends_on:
      mailer:
        condition: service_started

  database:
    volumes:
      - ./.github/mysql-ci-init.sql:/docker-entrypoint-initdb.d/10-ci-test-db.sql:ro
