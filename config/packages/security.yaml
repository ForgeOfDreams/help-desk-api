security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: [ROLE_AGENT]
        ROLE_AGENT: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Swagger/OpenAPI is intentionally public. Keep before the generic API firewall.
        api_docs:
            pattern: '^/api/docs(?:$|[/.])'
            security: false

        # Public onboarding endpoints must not challenge for a JWT.
        auth_public:
            pattern: '^/api/auth/(?:register|verify-email|set-password|resend-verification)$'
            security: false

        # JSON login issues a Lexik JWT. This firewall must precede the generic API firewall.
        login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

    access_control:
        - { path: '^/api/docs(?:$|[/.])', roles: PUBLIC_ACCESS }
        - { path: '^/api/auth/(?:register|verify-email|set-password|resend-verification)$', roles: PUBLIC_ACCESS }
        - { path: '^/api/auth/login$', roles: PUBLIC_ACCESS }
        - { path: '^/api/admin', roles: ROLE_ADMIN }
        - { path: '^/api', roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
