lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'

    # Short-lived access token. Add a refresh-token flow before production
    # if users should remain signed in across access-token expiration.
    token_ttl: 900
